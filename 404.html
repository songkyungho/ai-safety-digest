<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Safety Digest — 페이지 이동</title>
</head>
<body>
<p>페이지를 찾을 수 없습니다. <a href="index.html">아카이브로 이동</a></p>
<script>
(() => {
  const match = location.pathname.match(/\/(\d{4}-\d{2}-\d{2})\.html$/);
  if (!match) return;
  const base = location.pathname.slice(0, location.pathname.lastIndexOf("/") + 1);
  location.replace(base + "daily/" + match[1] + ".html" + location.search + location.hash);
})();
</script>
</body>
</html>

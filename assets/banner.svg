<svg viewBox="0 0 1408 768" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Safety Daily Digest banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e2b5c"/>
      <stop offset="55%" stop-color="#474284"/>
      <stop offset="100%" stop-color="#565193"/>
    </linearGradient>
    <linearGradient id="goldFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f3b84f"/>
      <stop offset="100%" stop-color="#e5a83c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1408" height="768" fill="url(#bg)"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1408" height="56" fill="#2a2848" opacity="0.55"/>
  <text x="704" y="34" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif"
        font-size="20" fill="#c4c0d8" letter-spacing="0.5">https://songkyungho.github.io/ai-safety-digest</text>

  <!-- decorative constellation network -->
  <g stroke="#c4c0d8" stroke-width="1.2" opacity="0.28">
    <line x1="40" y1="90" x2="180" y2="200"/>
    <line x1="180" y1="200" x2="90" y2="330"/>
    <line x1="90" y1="330" x2="40" y2="480"/>
    <line x1="180" y1="200" x2="330" y2="140"/>
    <line x1="330" y1="140" x2="470" y2="230"/>
    <line x1="90" y1="330" x2="230" y2="400"/>
    <line x1="40" y1="480" x2="150" y2="600"/>
    <line x1="150" y1="600" x2="90" y2="720"/>
    <line x1="150" y1="600" x2="300" y2="680"/>
    <line x1="900" y1="70" x2="1030" y2="150"/>
    <line x1="1030" y1="150" x2="1180" y2="90"/>
    <line x1="1030" y1="150" x2="1080" y2="270"/>
    <line x1="1080" y1="270" x2="1220" y2="230"/>
    <line x1="1220" y1="230" x2="1340" y2="150"/>
    <line x1="1080" y1="270" x2="1000" y2="380"/>
    <line x1="1000" y1="380" x2="1120" y2="450"/>
    <line x1="1120" y1="450" x2="1280" y2="410"/>
    <line x1="1120" y1="450" x2="1200" y2="580"/>
    <line x1="1200" y1="580" x2="1340" y2="640"/>
    <line x1="1200" y1="580" x2="1090" y2="670"/>
  </g>
  <g fill="#c4c0d8" opacity="0.5">
    <circle cx="40" cy="90" r="3"/><circle cx="180" cy="200" r="3"/><circle cx="90" cy="330" r="4.5"/>
    <circle cx="40" cy="480" r="3"/><circle cx="330" cy="140" r="3"/><circle cx="470" cy="230" r="3"/>
    <circle cx="230" cy="400" r="3"/><circle cx="150" cy="600" r="3"/><circle cx="90" cy="720" r="3"/>
    <circle cx="300" cy="680" r="3"/><circle cx="900" cy="70" r="3"/><circle cx="1030" cy="150" r="4"/>
    <circle cx="1180" cy="90" r="3"/><circle cx="1080" cy="270" r="4.5"/><circle cx="1220" cy="230" r="3"/>
    <circle cx="1340" cy="150" r="3"/><circle cx="1000" cy="380" r="3"/><circle cx="1120" cy="450" r="4.5"/>
    <circle cx="1280" cy="410" r="3"/><circle cx="1200" cy="580" r="4"/><circle cx="1340" cy="640" r="3"/>
    <circle cx="1090" cy="670" r="3"/>
  </g>

  <!-- icon accents (simple outlined shapes, matching original's circuit/scale/shield/gear motifs) -->
  <!-- shield (safety) -->
  <g transform="translate(100,320)" opacity="0.85">
    <circle cx="0" cy="0" r="46" fill="#3d3a6e" stroke="#a8a4d0" stroke-width="1.5"/>
    <path d="M0,-20 L16,-13 V4 C16,16 8,23 0,26 C-8,23 -16,16 -16,4 V-13 Z"
          fill="none" stroke="#ddd9f0" stroke-width="2.2"/>
  </g>

  <!-- scales of justice (bottom-left) -->
  <g transform="translate(250,610)" opacity="0.85">
    <circle cx="0" cy="0" r="42" fill="#3d3a6e" stroke="#a8a4d0" stroke-width="1.5"/>
    <line x1="0" y1="-18" x2="0" y2="16" stroke="#ddd9f0" stroke-width="2"/>
    <line x1="-20" y1="-14" x2="20" y2="-14" stroke="#ddd9f0" stroke-width="2"/>
    <line x1="-20" y1="-14" x2="-20" y2="-2" stroke="#ddd9f0" stroke-width="1.6"/>
    <line x1="20" y1="-14" x2="20" y2="-2" stroke="#ddd9f0" stroke-width="1.6"/>
    <path d="M-26,-2 A6,6 0 0 0 -14,-2 Z" fill="none" stroke="#ddd9f0" stroke-width="1.6"/>
    <path d="M14,-2 A6,6 0 0 0 26,-2 Z" fill="none" stroke="#ddd9f0" stroke-width="1.6"/>
    <line x1="-10" y1="16" x2="10" y2="16" stroke="#ddd9f0" stroke-width="2"/>
  </g>

  <!-- brain/network (AI) top area, right of center -->
  <g transform="translate(1010,150)" opacity="0.85">
    <circle cx="0" cy="0" r="46" fill="#3d3a6e" stroke="#a8a4d0" stroke-width="1.5"/>
    <circle cx="-9" cy="-6" r="12" fill="none" stroke="#ddd9f0" stroke-width="2"/>
    <circle cx="10" cy="-3" r="9" fill="none" stroke="#ddd9f0" stroke-width="2"/>
    <circle cx="-3" cy="13" r="8" fill="none" stroke="#ddd9f0" stroke-width="2"/>
    <line x1="-9" y1="-6" x2="10" y2="-3" stroke="#ddd9f0" stroke-width="1.6"/>
    <line x1="-9" y1="-6" x2="-3" y2="13" stroke="#ddd9f0" stroke-width="1.6"/>
    <line x1="10" y1="-3" x2="-3" y2="13" stroke="#ddd9f0" stroke-width="1.6"/>
  </g>

  <!-- circuit/chip (top right) -->
  <g transform="translate(1220,230)" opacity="0.85">
    <circle cx="0" cy="0" r="44" fill="#3d3a6e" stroke="#a8a4d0" stroke-width="1.5"/>
    <rect x="-13" y="-13" width="26" height="26" rx="3" fill="none" stroke="#ddd9f0" stroke-width="2"/>
    <line x1="-20" y1="-6" x2="-13" y2="-6" stroke="#ddd9f0" stroke-width="1.8"/>
    <line x1="-20" y1="6" x2="-13" y2="6" stroke="#ddd9f0" stroke-width="1.8"/>
    <line x1="13" y1="-6" x2="20" y2="-6" stroke="#ddd9f0" stroke-width="1.8"/>
    <line x1="13" y1="6" x2="20" y2="6" stroke="#ddd9f0" stroke-width="1.8"/>
    <line x1="-6" y1="-20" x2="-6" y2="-13" stroke="#ddd9f0" stroke-width="1.8"/>
    <line x1="6" y1="13" x2="6" y2="20" stroke="#ddd9f0" stroke-width="1.8"/>
  </g>

  <!-- gear (governance) bottom right -->
  <g transform="translate(1280,530)" opacity="0.85">
    <circle cx="0" cy="0" r="44" fill="#3d3a6e" stroke="#a8a4d0" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#ddd9f0" stroke-width="2"/>
    <g stroke="#ddd9f0" stroke-width="2.4">
      <line x1="0" y1="-22" x2="0" y2="-15"/>
      <line x1="0" y1="15" x2="0" y2="22"/>
      <line x1="-22" y1="0" x2="-15" y2="0"/>
      <line x1="15" y1="0" x2="22" y2="0"/>
      <line x1="-15.5" y1="-15.5" x2="-10.5" y2="-10.5"/>
      <line x1="10.5" y1="10.5" x2="15.5" y2="15.5"/>
      <line x1="-15.5" y1="15.5" x2="-10.5" y2="10.5"/>
      <line x1="10.5" y1="-10.5" x2="15.5" y2="-15.5"/>
    </g>
  </g>

  <!-- sparkle accent -->
  <g transform="translate(1330,660)" opacity="0.6" fill="#ddd9f0">
    <path d="M0,-22 L5,-5 L22,0 L5,5 L0,22 L-5,5 L-22,0 L-5,-5 Z"/>
  </g>

  <!-- main text block -->
  <text x="170" y="205" font-family="Arial, 'Segoe UI', sans-serif" font-weight="600"
        font-size="26" letter-spacing="4" fill="#e8e4f4">DAILY UPDATES | RESEARCH | POLICY | ETHICS</text>

  <text x="164" y="330" font-family="Arial, 'Segoe UI', sans-serif" font-weight="800"
        font-size="98" letter-spacing="1" fill="#ffffff" filter="url(#softShadow)">AI SAFETY</text>

  <text x="164" y="460" font-family="Arial, 'Segoe UI', sans-serif" font-weight="800"
        font-size="98" letter-spacing="1" fill="url(#goldFill)" filter="url(#softShadow)">DAILY DIGEST</text>

  <text x="168" y="545" font-family="Georgia, 'Times New Roman', serif" font-size="30"
        fill="#f6f1e4">A Github Pages Site | by Kyungho David Song</text>
</svg>
